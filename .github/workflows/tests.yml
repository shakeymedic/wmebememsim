name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tests/package-lock.json
      - name: Build the site (as Netlify does)
        run: npm ci && npm run build
      - name: Install test dependencies
        working-directory: tests
        run: npm ci && npx playwright install --with-deps chromium
      - name: Session clean-up logic
        run: node scripts/cleanup-sessions.mjs --self-test
      - name: Run the tests
        working-directory: tests
        run: npx playwright test
        env:
          CI: true

  rules:
    # database.rules.json in the real Firebase Realtime Database emulator.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/rules/package-lock.json
      - name: Install
        working-directory: tests/rules
        run: npm ci
      - name: Test the rules in the emulator
        working-directory: tests/rules
        run: npm test

  e2e:
    # The real app and the real Firebase SDK against the emulator, enforcing database.rules.json.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tests/package-lock.json
            tests/rules/package-lock.json
      - name: Build the site
        run: npm ci && npm run build
      - name: Install
        run: |
          (cd tests && npm ci && npx playwright install --with-deps chromium)
          (cd tests/rules && npm ci)
      - name: End-to-end in the emulator
        working-directory: tests/rules
        run: npm run e2e
        env:
          CI: true
