    <script>
      // Pinch-zoom stays available (WCAG 1.4.4), except on the room monitor, where an accidental
      // zoom would hide the obs from the whole team.
      try {
        if (new URLSearchParams(location.search).get('mode') === 'monitor')
          document.getElementById('viewport').setAttribute('content', 'width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no');
      } catch (e) {}
    </script>

    <script>
      // Offline support (sw.js). Wrapped: reading navigator.serviceWorker throws in a sandboxed
      // iframe and in some private-browsing modes.
      try {
        if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(function () {});
      } catch (e) { /* the app works without it */ }
    </script>

    <!-- Firebase Authentication, same compat v8 SDK version as the two above so the
         existing initialisation style is unchanged. This script is PURELY ADDITIVE: if it fails to
         load, or if Email/Password has not been enabled in the console, data/auth.js degrades to
         "sign-in not configured" and every existing feature keeps working with no account. -->
    <!-- The sign-in library is NOT loaded up front: data/auth.js fetches it only when someone signs
         in, or when this browser has signed in before, so monitors and defib tablets never
         download it. (The build rewrites this URL to the self-hosted copy.) -->
    <script>window.FIREBASE_AUTH_SRC = "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js";</script>

    <style>
        /* Base Setup */
        html, body { height: 100%; overflow: hidden; background-color: #0f172a; color: #f1f5f9; }
        #root { height: 100%; width: 100%; display: flex; flex-direction: column; }
        
        /* Utilities */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Animations */
        .animate-fadeIn { animation: fadeIn 0.5s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        
        .flash-red { animation: flashRed 1s infinite; }
        @keyframes flashRed { 0%, 100% { box-shadow: inset 0 0 0 0 transparent; } 50% { box-shadow: inset 0 0 50px 20px rgba(239, 68, 68, 0.5); } }
        
        .flash-green { animation: flashGreen 1s ease-out; }
        @keyframes flashGreen { 0% { box-shadow: inset 0 0 50px 20px rgba(34, 197, 94, 0.5); } 100% { box-shadow: inset 0 0 0 0 transparent; } }

        /* SET_FLASH:'yellow' has been dispatched by initCharge() since Wave 3 and the
           monitor already reads it to show "CHARGING...", but there was no matching CSS class, so
           the defibrillator charge produced no visual cue anywhere. Amber, single-shot, matching
           the charge tone's ~1s duration. */
        .flash-yellow { animation: flashYellow 1s ease-out; }
        @keyframes flashYellow { 0%, 100% { box-shadow: inset 0 0 0 0 transparent; } 50% { box-shadow: inset 0 0 50px 20px rgba(245, 158, 11, 0.45); } }
        
        /* Room monitor obs tiles (data/components.js VitalDisplay): the number takes the largest size
           that fits its tile, so it grows on a TV and still fits a tablet or a half-width window.
           Container units measure the tile itself; a browser without them uses the vh fallback.
           Monospace digits are about 0.6em wide: 3 characters at 44cqw fill about 80% of the tile,
           '120/75' at 23cqw about 83%. */
        .obs-tile { container-type: size; }
        .obs-num { font-size: clamp(2.5rem, 9vh, 9rem); line-height: 1; }
        .obs-num.obs-v2 { font-size: clamp(1.5rem, 5vh, 5rem); }
        .obs-num.obs-nibp { font-size: clamp(1.875rem, 6vh, 6rem); }
        .obs-num.obs-nibp-dia { font-size: clamp(1.5rem, 4.8vh, 4.8rem); }
        .obs-nibp-slash { font-size: clamp(1.25rem, 3vh, 3rem); line-height: 1; }
        @supports (width: 1cqh) {
            .obs-num { font-size: clamp(2rem, min(56cqh, 44cqw), 20rem); }
            .obs-num.obs-v2 { font-size: clamp(1.25rem, min(34cqh, 23cqw), 12rem); }
            .obs-num.obs-nibp { font-size: clamp(1.5rem, min(36cqh, 22cqw), 12rem); }
            .obs-num.obs-nibp-dia { font-size: clamp(1.25rem, min(29cqh, 18cqw), 10rem); }
            .obs-nibp-slash { font-size: clamp(1rem, min(14cqh, 8cqw), 5rem); }
        }

        .animate-pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }

        /* Accessibility: visible focus indicators (WCAG 2.4.7). */
        :focus { outline: none; }
        :focus-visible { outline: 2px solid #38bdf8; outline-offset: 2px; border-radius: 4px; }
        button:focus-visible, [role="button"]:focus-visible {
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.6);
            outline: none;
        }
        input:focus-visible, textarea:focus-visible, select:focus-visible {
            outline: 2px solid #38bdf8;
            outline-offset: 1px;
        }
    </style>
</head>

    <!-- WAVE 4b / PART B + C: accounts, admin approval, entitlements and the restricted-content
         loader. Loaded AFTER components.js (it uses Button/Modal/Lucide) and BEFORE the screens.
         It is optional by construction: nothing in the engine or any screen depends on it, and if

    <script type="text/babel">
        // --- CONFIGURATION ---
        const firebaseConfig = window.FIREBASE_CONFIG;

        // --- INIT FIREBASE ---
        window.firebaseSyncBootstrap = { state: 'connecting', message: null };
        try {
            if (!window.firebase) throw new Error('Firebase SDK did not load.');
            if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
            window.db = firebase.database();
            if (window.useFirebaseEmulatorIfAsked) window.useFirebaseEmulatorIfAsked(window.db);
            console.info("Firebase Realtime Database initialized");
        } catch (e) {
            window.db = null;
            window.firebaseSyncBootstrap = {
                state: 'unavailable',
                message: `Firebase initialization failed: ${e.message || 'unknown error'}`
            };
            console.error("Firebase Init Failed:", e);
        }

        // No service worker at this scope on purpose. There is no root sw.js, and adding a
        // stale-while-revalidate cache here would risk serving last session's code after a fix ships —
        // unacceptable for clinical content. defib/index.html keeps its own SW at its own scope.

        // --- SESSION CODES ---
        // Six characters from an alphabet with no look-alikes (no 0/O, 1/I/L), drawn from the
        // crypto RNG: ~887 million codes instead of 4 characters of Math.random() (~1.7 million,
        // including ambiguous ones that were easy to mistype on a tablet).
        window.SESSION_CODE_ALPHABET = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
        window.newSessionCode = () => {
            const A = window.SESSION_CODE_ALPHABET, n = 6;
            const out = [];
            try {
                const buf = new Uint32Array(n);
                window.crypto.getRandomValues(buf);
                for (let i = 0; i < n; i++) out.push(A[buf[i] % A.length]);
            } catch (e) {
                for (let i = 0; i < n; i++) out.push(A[Math.floor(Math.random() * A.length)]);
            }
            return out.join('');
        };
        window.isCurrentSessionCode = (code) => new RegExp('^[' + window.SESSION_CODE_ALPHABET + ']{6}$').test(String(code || ''));

        // --- APP COMPONENT ---
        // App owns only session/view routing. The simulation engine lives in ControllerApp, so that in
        // monitor mode exactly ONE useSimulation instance exists (MonitorContainer's). Previously both
        // this component and MonitorContainer created one: two AudioContexts (only one of which the
        // "Tap to Enable Sound" overlay ever resumed) and two RTDB listeners per student device.
        // This tab, for the one-controller-tab-per-session check in App.
        const CTRL_TAB = Math.random().toString(36).slice(2);
        const App = () => {
            const { useState, useEffect } = React;
            const { MonitorContainer, ErrorBoundary } = window;

            // URL Params for Monitor Mode
            const urlParams = new URLSearchParams(window.location.search);
            // A new visit first asks what this device is for (controller or patient screen). A
            // reload in the same browser tab goes straight back to the controller.
            const initialMode = urlParams.get('mode') === 'monitor' ? 'monitor' : (() => {
                try { if (sessionStorage.getItem('wmebem_device_role') === 'controller') return 'setup'; } catch (e) {}
                return 'welcome';
            })();
            const rawInitialSession = urlParams.get('session');
            const initialSession = rawInitialSession ? (rawInitialSession.trim().toUpperCase().replace(/[^A-Z0-9]/g, '') || null) : null;

            const [view, setView] = useState(initialMode);
            // Where a patient screen starts (an older link's ?screen=); the controller chooses from then on.
            const [screen, setScreen] = useState(() => urlParams.get('screen') || null);
            // Controller code must survive reloads and back-navigation, otherwise any monitor already
            // paired with it is orphaned. Resolve URL -> localStorage -> mint new.
            // The CONTROLLER always runs on a current-format code (six characters, no look-alikes).
            // An old four-character code — remembered in this browser or carried in the address
            // bar — is replaced here, which is why a hard refresh alone used to keep it: both
            // places survive a refresh. Monitors still JOIN any code they are given, old or new.
            const [sessionID, setSessionID] = useState(() => {
                if (initialMode === 'monitor') return initialSession || null;
                if (initialSession && window.isCurrentSessionCode(initialSession)) return initialSession;
                let stored = null;
                try { stored = localStorage.getItem('wmebem_session_id'); } catch (e) {}
                // A second controller tab in this browser must not take over the first one's session
                // (both would drive the same room monitor). If another open tab is using the
                // remembered code, this tab gets a new one.
                let busy = false;
                try {
                    const hb = stored && JSON.parse(localStorage.getItem('wmebem_ctrl_tab_' + stored) || 'null');
                    busy = !!(hb && hb.tab !== CTRL_TAB && Date.now() - Number(hb.ts) < 6000);
                } catch (e) {}
                return (stored && !busy && window.isCurrentSessionCode(stored)) ? stored : window.newSessionCode();
            });

            // This tab's claim on its code (see above), refreshed while it is open and released on leaving,
            // so a reload or going back to the start still keeps the code.
            useEffect(() => {
                if (!sessionID || view === 'monitor') return;
                const beat = () => { try { localStorage.setItem('wmebem_ctrl_tab_' + sessionID, JSON.stringify({ tab: CTRL_TAB, ts: Date.now() })); } catch (e) {} };
                const release = () => {
                    try { const k = 'wmebem_ctrl_tab_' + sessionID, hb = JSON.parse(localStorage.getItem(k) || 'null'); if (hb && hb.tab === CTRL_TAB) localStorage.removeItem(k); } catch (e) {}
                };
                beat();
                const id = setInterval(beat, 2000);
                window.addEventListener('pagehide', release);
                return () => { clearInterval(id); window.removeEventListener('pagehide', release); release(); };
            }, [sessionID, view]);

            useEffect(() => {
                if (!sessionID || view === 'monitor') return;
                try { localStorage.setItem('wmebem_session_id', sessionID); } catch (e) {}
                // Keep the code in the URL so a reload or a shared link resolves to the same session.
                if (urlParams.get('session') !== sessionID) {
                    const next = new URLSearchParams(window.location.search);
                    next.set('session', sessionID);
                    window.history.replaceState({}, '', `${window.location.pathname}?${next.toString()}`);
                }
            }, [sessionID, view]);

            // 1. Monitor View (Clean, Full Screen) — no controller engine is created at all.
            if (view === 'monitor') {
                return <ErrorBoundary><MonitorContainer sessionID={sessionID} screen={screen} /></ErrorBoundary>;
            }
            return <ControllerApp view={view} setView={setView} sessionID={sessionID} setSessionID={setSessionID} setScreen={setScreen} />;
        };

        const ControllerApp = ({ view, setView, sessionID, setSessionID, setScreen }) => {
            const { useState, useEffect } = React;
            const { SetupScreen, JoinScreen, WelcomeScreen, BriefingScreen, LiveSimContainer, useSimulation, ErrorBoundary, AccountButton, useAuth, useScreenLinkController, ScreenLinkContext } = window;
            const [generatedScenario, setGeneratedScenario] = useState(null);

            // Accounts are OPTIONAL and OFF THE CRITICAL PATH. useAuth() never
            // throws, never blocks and never prompts; when Firebase Authentication is not enabled
            // it simply reports available:false. The only things it gates are the Restricted
            // premade section and the Admin panel — requirement B4.
            const auth = useAuth ? useAuth() : null;

            // --- SIM ENGINE ---
            // Initializes the logic core. Pass sessionID to enable sync.
            const engine = useSimulation(generatedScenario, false, sessionID);
            // Console / test handle on the live controller engine (read it, don't build on it).
            useEffect(() => { window.__simEngine = engine; });
            // The patient screens in this session: numbered here, and told what to show (Screens).
            const screenLink = useScreenLinkController(sessionID, !['welcome', 'join'].includes(view));
            // No scenario chosen yet on this controller: every patient screen on its code shows
            // WAITING FOR CONTROLLER, never a default or left-over patient. Not on the welcome or join
            // screens, where this device may be about to become a patient screen on that code.
            const hasScenario = !!engine.state.scenario;
            const syncConnected = (engine.state.syncStatus || {}).state === 'connected';
            useEffect(() => {
                if (hasScenario || ['welcome', 'join'].includes(view)) return;
                engine.clearLivePatient();
            }, [hasScenario, view, sessionID, syncConnected]);

            // --- HANDLERS ---
            // ---- MONITORING AT THE START. Most scenarios begin with nothing attached, because putting the
            // monitoring on is part of the candidates' task. A patient who is already somewhere monitored (in
            // theatre, on intensive care, on a ventilator, in resus waiting for cardioversion or pacing) starts
            // with the standard monitoring on, and an intubated patient with capnography too. One atomic action,
            // logged once, and never counted as something the candidates did.
            const startMonitored = (opts) => {
                const o = opts || {};
                engine.dispatch({ type: 'ATTACH_SENSORS', payload: { keys: ['Obs'], etco2: !!o.capnography } });
                engine.addLogEntry(`The patient starts on standard monitoring (ECG, SpO2, NIBP, temperature${o.capnography ? ' and capnography' : ''}).`, 'system');
            };

            const handleGenerate = (scenario, modifiers) => {
                setGeneratedScenario(scenario);
                engine.dispatch({ type: 'LOAD_SCENARIO', payload: scenario });
                setView('briefing');
            };

            // The briefing screen can start the patient already on the monitor (its tick box).
            // It opens the live controller; it does not start the clock. Every launch mode waits
            // for START on the controller, which says "Not started" until it is pressed.
            const handleStart = (opts) => {
                if (opts && opts.monitored) startMonitored({});
                setView('livesim');
            };

            // ---- WAVE 4b / PART A: QUICK SIM ------------------------------------------------
            // Deliberately the SAME path as handleGenerate (same engine, same LOAD_SCENARIO, same
            // Firebase session, same monitor) with exactly two differences: the scenario is the
            // synthetic blank patient from buildQuickSimScenario(), and the briefing screen is
            // skipped because there is no brief to read. It does NOT auto-start: like every launch
            // mode, the patient goes live when the facilitator presses START.
            const handleQuickSim = (opts) => {
                try {
                    const scenario = window.buildQuickSimScenario(opts || {});
                    setGeneratedScenario(scenario);
                    engine.dispatch({ type: 'LOAD_SCENARIO', payload: scenario });
                    setView('livesim');
                } catch (err) {
                    console.error('Quick Sim failed to start:', err);
                    alert('Could not start Quick Sim: ' + err.message);
                }
            };

            // ---- DEFIB SIM: the same path again (same engine, session and monitor), with the
            // patient built by data/defibsim.js. No briefing screen; the clock starts at START or at
            // the learner's first press on the defib (data/engine-sync.js autoStartClock).
            const handleDefibSim = (opts) => {
                try {
                    const scenario = window.DefibSim.buildScenario(opts || {});
                    setGeneratedScenario(scenario);
                    engine.dispatch({ type: 'LOAD_SCENARIO', payload: scenario });
                    // A defib scenario assumes IV access is in place, so drugs given from the Defib
                    // controller are not flagged as given without access.
                    engine.dispatch({ type: 'UPDATE_INTERVENTION_STATE', payload: { add: ['IV Access'] } });
                    // A patient with a pulse (cardioversion, pacing) is already on the resus monitor; a
                    // cardiac arrest starts with nothing on, so the team puts the pads on.
                    if (!window.RHYTHMS.isPulseless((scenario.ecg && scenario.ecg.type) || 'Sinus Rhythm')) startMonitored({});
                    setView('livesim');
                } catch (err) {
                    console.error('Defib Sim failed to start:', err);
                    alert('Could not start Defib Sim: ' + err.message);
                }
            };

            // ---- VENTILATOR SIM: the same path again, with the patient built by data/ventsim.js. The
            // engine loads the scenario's lungs and puts the ventilator on the room monitor.
            const handleVentSim = (opts) => {
                try {
                    const scenario = window.VentSim.buildScenario(opts || {});
                    setGeneratedScenario(scenario);
                    engine.dispatch({ type: 'LOAD_SCENARIO', payload: scenario });
                    // An intubated scenario starts with the tube recorded (the ventilator's airway check)
                    // and IV access in place.
                    engine.dispatch({ type: 'UPDATE_INTERVENTION_STATE', payload: { add: scenario.ventSim.airway === 'tube' ? ['IV Access', 'RSI'] : ['IV Access'] } });
                    // Already on the monitor (theatre, intensive care, resus), with capnography once intubated.
                    startMonitored({ capnography: scenario.ventSim.airway === 'tube' });
                    setView('livesim');
                } catch (err) {
                    console.error('Ventilator Sim failed to start:', err);
                    alert('Could not start Ventilator Sim: ' + err.message);
                }
            };

            // A patient screen joins with the code alone; the controller numbers it and chooses what
            // it shows. The code goes into the address so a reload keeps it.
            const handleJoin = (code) => {
                const c = String(code || '').trim().toUpperCase();
                try { window.history.replaceState({}, '', window.SimScreens.screenUrl(c)); } catch (e) {}
                setScreen(null);
                setSessionID(c);
                setView('monitor');
            };

            const handleResume = (saved) => {
                if (!saved || !saved.scenario) return;
                // The scenario is still loaded in this tab (Back from the live screen): go straight
                // back to it. Restoring the 5-second snapshot instead lost the latest shocks and log.
                if (saved.live) { setView('livesim'); return; }
                try {
                    // Snapshots only ever held {id, title} before, so rebuild the full scenario from
                    // the live definitions before anything tries to render it.
                    const scenario = window.rehydrateScenario(saved.scenario);
                    if (!scenario) return;
                    setGeneratedScenario(scenario);
                    engine.dispatch({ type: 'RESTORE_SESSION', payload: { ...saved, scenario } });
                    setView('livesim');
                } catch (e) {
                    console.error('Failed to resume session', e);
                    try { localStorage.removeItem('wmebem_sim_state'); } catch (err) {}
                    setResumeData(null);
                    alert('That saved session could not be restored and has been cleared.');
                }
            };

            // --- RECOVERY CHECK ---
            const [resumeData, setResumeData] = useState(null);
            useEffect(() => {
                // localStorage throws outright in sandboxed frames (previews, embeds), which used to
                // take the whole React tree down with a blank screen. Never let storage be fatal.
                if (view !== 'setup') return;
                if (engine.state.scenario && !engine.state.isFinished) {
                    setResumeData({ scenario: engine.state.scenario, live: true });
                    return;
                }
                let saved = null;
                try { saved = localStorage.getItem('wmebem_sim_state'); } catch (e) { console.warn('Session recovery unavailable (storage blocked)', e); }
                if (saved && view === 'setup') {
                    try {
                        const parsed = JSON.parse(saved);
                        if (parsed && parsed.scenario) setResumeData(parsed);
                    } catch(e) { console.warn('Discarding unreadable saved session', e); }
                }
            }, [view]);

            // --- RENDER ---
            // Controller Views (Header + Footer)
            return (
                // PHONE LAYOUT: during a live sim the WHOLE page scrolls as one on narrow screens
                // (header included), instead of a fixed top section with small scroll boxes inside
                // it. Desktop/tablet (md+) keeps the fixed-height, panel-scrolling layout.
                <ScreenLinkContext.Provider value={screenLink}>
                <div className={`h-full flex flex-col ${view === 'livesim' ? 'max-md:overflow-y-auto' : view === 'debrief' ? 'max-lg:overflow-y-auto' : ''}`}>
                    {/* Header */}
                    <header className="flex items-center justify-between p-3 border-b border-slate-800 bg-slate-900 flex-shrink-0">
                        <div className="flex items-center gap-3">
                            <a href="https://emevidence.org" target="_blank" rel="noopener noreferrer">
                                <img src="images/emevidence-logo.png" alt="EM Evidence Logo" className="h-10 object-contain" />
                            </a>
                            <h1 className="text-xl font-bold text-sky-400 tracking-tight hidden md:block">EM Evidence Sim</h1>
                        </div>
                        <div className="flex items-center gap-3">
                            {!['setup', 'welcome', 'join'].includes(view) && sessionID && (
                                <div className="flex flex-col items-end">
                                    <div className="text-[9px] text-slate-400 uppercase font-bold tracking-wider">Session ID</div>
                                    <div className="font-mono text-lg font-bold text-white tracking-widest leading-none select-all cursor-pointer" title="Copy the session code" onClick={()=>{
                                        const ok = () => alert('Session code copied.');
                                        const fail = () => alert('Could not copy automatically. The session code is ' + sessionID);
                                        try { navigator.clipboard ? navigator.clipboard.writeText(sessionID).then(ok, fail) : fail(); } catch (e) { fail(); }
                                    }}>{sessionID}</div>
                                </div>
                            )}
                            {/* Optional account control. Renders "Sign in" and nothing else until
                                clicked; it never interrupts, and the app is fully usable ignoring it. */}
                            {auth && AccountButton && <AccountButton auth={auth} />}
                        </div>
                    </header>

                    {/* Main Content */}
                    <main className={`flex-grow overflow-hidden relative bg-slate-900 ${view === 'livesim' ? 'max-md:overflow-visible max-md:flex-none' : view === 'debrief' ? 'max-lg:overflow-visible max-lg:flex-none' : ''}`}>
                      <ErrorBoundary onReset={() => { try { engine.reset(); } catch (e) {} setView('setup'); }}>
                        {view === 'setup' && (
                            <SetupScreen 
                                onGenerate={handleGenerate} 
                                onQuickSim={handleQuickSim}
                                onDefibSim={handleDefibSim}
                                onVentSim={handleVentSim}
                                auth={auth}
                                onJoinClick={() => setView('join')} 
                                // Back to the first screen (Controller or Patient screen). A full reload, as the
                                // patient screen's "Back to start screen" does, so nothing of this controller lingers.
                                onStartScreen={() => { try { sessionStorage.removeItem('wmebem_device_role'); } catch (e) {} window.location.href = window.location.pathname; }}
                                sessionID={sessionID}
                                onNewSessionCode={() => setSessionID(window.newSessionCode())}
                                savedState={resumeData}
                                onResume={() => handleResume(resumeData)}
                            />
                        )}
                        {view === 'welcome' && WelcomeScreen && (
                            <WelcomeScreen
                                onController={() => { try { sessionStorage.setItem('wmebem_device_role', 'controller'); } catch (e) {} setView('setup'); }}
                                onPatientScreen={() => setView('join')}
                            />
                        )}
                        {view === 'join' && <JoinScreen onJoin={handleJoin} onBack={() => setView('welcome')} />}
                        {view === 'briefing' && (
                            <BriefingScreen 
                                scenario={generatedScenario} 
                                sim={engine} 
                                onStart={handleStart} 
                                // Back from a briefing unloads the scenario it loaded: it never ran, so the
                                // menu must not offer it as "Scenario paused", and the screens go back to waiting.
                                onBack={() => { engine.reset(); setView('setup'); }} 
                            />
                        )}
                        {(view === 'livesim' || view === 'debrief') && (
                            <LiveSimContainer 
                                sim={engine} 
                                view={view} 
                                setView={setView} 
                                onRestart={() => {
                                    // A finished run is not offered for resuming.
                                    try { localStorage.removeItem('wmebem_sim_state'); } catch (e) {}
                                    setResumeData(null);
                                    engine.reset(); setView('setup');
                                }}
                                sessionID={sessionID}
                            />
                        )}
                      </ErrorBoundary>
                    </main>

                    {/* Footer */}
                    {/* The instructor guides (static pages in guides/) sit at the far left; the
                        controller layout is never shown on the room monitor or the defib. */}
                    <footer className="bg-slate-950 border-t border-slate-800 px-2 py-1 text-center text-[10px] text-slate-400 flex-shrink-0 flex flex-wrap items-center justify-center gap-x-4 gap-y-1 md:grid md:grid-cols-[1fr_auto_1fr]">
                        <p className="md:justify-self-start" data-testid="guide-links">
                            <span className="inline-flex items-center gap-1.5 px-2 py-0.5 rounded border border-amber-600/70 bg-amber-950/50 text-amber-300">
                                <span className="font-bold uppercase tracking-wider">Instructor guides:</span>
                                <a href="guides/quick-start.html" target="_blank" rel="noopener" className="underline hover:text-white">Quick start</a>
                                <span aria-hidden="true">&middot;</span>
                                <a href="guides/instructor-guide.html" target="_blank" rel="noopener" className="underline hover:text-white">Full guide</a>
                                <span aria-hidden="true">&middot;</span>
                                <a href="guides/index.html" target="_blank" rel="noopener" className="underline hover:text-white">PDFs</a>
                                <span aria-hidden="true">&middot;</span>
                                <a href="guides/image-credits.html" target="_blank" rel="noopener" className="underline hover:text-white">Image credits</a>
                            </span>
                        </p>
                        <p>&copy; {new Date().getFullYear()} <a href="https://emevidence.org" target="_blank" rel="noopener noreferrer" className="text-sky-400 hover:text-sky-300">EM Evidence</a> &nbsp;&bull;&nbsp; <a href="https://emevidence.org" target="_blank" rel="noopener noreferrer" className="hover:text-slate-400">emevidence.org</a> &nbsp;&bull;&nbsp; <a href="mailto:emevidence999@gmail.com" className="hover:text-slate-400">emevidence999@gmail.com</a></p>
                        {/* Which deploy this is, so anyone can check they are on the latest one (data/version.js). */}
                        <p className="md:justify-self-end font-mono text-slate-400" data-testid="app-version" title={window.APP_VERSION ? `Built ${window.APP_VERSION.built} from commit ${window.APP_VERSION.sha}` : 'Running from the source files, not a deploy'}>
                            {window.APP_VERSION ? `Version ${window.APP_VERSION.label}` : 'Version: development copy'}
                        </p>
                    </footer>
                </div>
                </ScreenLinkContext.Provider>
            );
        };

        // --- MOUNT ---
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
