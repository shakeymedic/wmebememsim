<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="EM Evidence Sim">
    <link rel="manifest" href="manifest.json">
    <title>EM Evidence Sim</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { 
                extend: {
                    colors: {
                        slate: { 950: '#020617' } 
                    }
                } 
            },
            plugins: [],
        }
    </script>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <!-- WAVE 4b / B1: Firebase Authentication, same compat v8 SDK version as the two above so the
         existing initialisation style is unchanged. This script is PURELY ADDITIVE: if it fails to
         load, or if Email/Password has not been enabled in the console, data/auth.js degrades to
         "sign-in not configured" and every existing feature keeps working with no account. -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

    <style>
        /* Base Setup */
        html, body { height: 100%; overflow: hidden; background-color: #0f172a; color: #f1f5f9; }
        #root { height: 100%; width: 100%; display: flex; flex-direction: column; }
        
        /* Utilities */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Animations */
        .animate-fadeIn { animation: fadeIn 0.5s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        
        .flash-red { animation: flashRed 1s infinite; }
        @keyframes flashRed { 0%, 100% { box-shadow: inset 0 0 0 0 transparent; } 50% { box-shadow: inset 0 0 50px 20px rgba(239, 68, 68, 0.5); } }
        
        .flash-green { animation: flashGreen 1s ease-out; }
        @keyframes flashGreen { 0% { box-shadow: inset 0 0 50px 20px rgba(34, 197, 94, 0.5); } 100% { box-shadow: inset 0 0 0 0 transparent; } }

        /* WAVE 4b / D6: SET_FLASH:'yellow' has been dispatched by initCharge() since Wave 3 and the
           monitor already reads it to show "CHARGING...", but there was no matching CSS class, so
           the defibrillator charge produced no visual cue anywhere. Amber, single-shot, matching
           the charge tone's ~1s duration. */
        .flash-yellow { animation: flashYellow 1s ease-out; }
        @keyframes flashYellow { 0%, 100% { box-shadow: inset 0 0 0 0 transparent; } 50% { box-shadow: inset 0 0 50px 20px rgba(245, 158, 11, 0.45); } }
        
        .animate-pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }

        /* Accessibility: visible focus indicators (WCAG 2.4.7). */
        :focus { outline: none; }
        :focus-visible { outline: 2px solid #38bdf8; outline-offset: 2px; border-radius: 4px; }
        button:focus-visible, [role="button"]:focus-visible {
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.6);
            outline: none;
        }
        input:focus-visible, textarea:focus-visible, select:focus-visible {
            outline: 2px solid #38bdf8;
            outline-offset: 1px;
        }
    </style>
</head>
<body class="antialiased selection:bg-sky-500 selection:text-white">
    <div id="root">
        <div class="flex h-full items-center justify-center text-slate-500 flex-col gap-4">
            <svg class="animate-spin h-10 w-10 text-sky-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <span class="font-mono text-sm tracking-widest uppercase">Initializing...</span>
        </div>
    </div>

    <!-- WAVE 3: the shared rhythm registry. Plain JS (no JSX), loaded with a bare script tag so it
         executes BEFORE any text/babel module and is therefore available to components.js and
         engine.js at definition time. The standalone defib page loads the SAME file. -->
    <script src="data/rhythms.js"></script>

    <script type="text/babel" src="data/interventions.js"></script>
    <script type="text/babel" src="data/generators.js"></script>
    <script type="text/babel" src="data/scenarios.js"></script>
    <script type="text/babel" src="data/components.js"></script>
    <script type="text/babel" src="data/engine.js"></script>

    <!-- WAVE 4b / PART B + C: accounts, admin approval, entitlements and the restricted-content
         loader. Loaded AFTER components.js (it uses Button/Modal/Lucide) and BEFORE the screens.
         It is optional by construction: nothing in the engine or any screen depends on it, and if
         sign-in is not configured the app behaves exactly as it did before Wave 4b. -->
    <script type="text/babel" src="data/auth.js"></script>

    <script type="text/babel" src="data/screens/setup.js"></script>
    <script type="text/babel" src="data/screens/monitor.js"></script>
    <script type="text/babel" src="data/screens/livesim.js"></script>
    <script type="text/babel" src="data/screens/debrief.js"></script>
    <script type="text/babel" src="data/screens/index.js"></script>

    <script type="text/babel">
        // --- CONFIGURATION ---
        const firebaseConfig = {
            apiKey: "AIzaSyBz77EHl9QhFJ0k2ZFODydChuGeCAXq1II",
            authDomain: "wmebem-sim.firebaseapp.com",
            // This project uses Realtime Database, not Firestore. Keep the exact database host
            // explicit rather than relying on the SDK's projectId-derived fallback.
            databaseURL: "https://wmebem-sim-default-rtdb.firebaseio.com",
            projectId: "wmebem-sim",
            storageBucket: "wmebem-sim.firebasestorage.app",
            messagingSenderId: "143041936940",
            appId: "1:143041936940:web:4d15c3fc3ce7e10c081b89",
            measurementId: "G-8C6WW1EWXJ"
        };

        // --- INIT FIREBASE ---
        window.firebaseSyncBootstrap = { state: 'connecting', message: null };
        try {
            if (!window.firebase) throw new Error('Firebase SDK did not load.');
            if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
            window.db = firebase.database();
            console.info("Firebase Realtime Database initialized");
        } catch (e) {
            window.db = null;
            window.firebaseSyncBootstrap = {
                state: 'unavailable',
                message: `Firebase initialization failed: ${e.message || 'unknown error'}`
            };
            console.error("Firebase Init Failed:", e);
        }

        // No service worker at this scope on purpose. There is no root sw.js, and adding a
        // stale-while-revalidate cache here would risk serving last session's code after a fix ships —
        // unacceptable for clinical content. defib/index.html keeps its own SW at its own scope.

        // --- APP COMPONENT ---
        // App owns only session/view routing. The simulation engine lives in ControllerApp, so that in
        // monitor mode exactly ONE useSimulation instance exists (MonitorContainer's). Previously both
        // this component and MonitorContainer created one: two AudioContexts (only one of which the
        // "Tap to Enable Sound" overlay ever resumed) and two RTDB listeners per student device.
        const App = () => {
            const { useState, useEffect } = React;
            const { MonitorContainer, ErrorBoundary } = window;

            // URL Params for Monitor Mode
            const urlParams = new URLSearchParams(window.location.search);
            const initialMode = urlParams.get('mode') === 'monitor' ? 'monitor' : 'setup';
            const rawInitialSession = urlParams.get('session');
            const initialSession = rawInitialSession ? rawInitialSession.trim().toUpperCase() : null;

            const [view, setView] = useState(initialMode);
            // Controller code must survive reloads and back-navigation, otherwise any monitor already
            // paired with it is orphaned. Resolve URL -> localStorage -> mint new.
            const [sessionID, setSessionID] = useState(() => {
                if (initialSession) return initialSession;
                if (initialMode === 'monitor') return null;
                let stored = null;
                try { stored = localStorage.getItem('wmebem_session_id'); } catch (e) {}
                return stored || Math.random().toString(36).substring(2, 6).toUpperCase();
            });

            useEffect(() => {
                if (!sessionID || view === 'monitor') return;
                try { localStorage.setItem('wmebem_session_id', sessionID); } catch (e) {}
                // Keep the code in the URL so a reload or a shared link resolves to the same session.
                if (urlParams.get('session') !== sessionID) {
                    const next = new URLSearchParams(window.location.search);
                    next.set('session', sessionID);
                    window.history.replaceState({}, '', `${window.location.pathname}?${next.toString()}`);
                }
            }, [sessionID, view]);

            // 1. Monitor View (Clean, Full Screen) — no controller engine is created at all.
            if (view === 'monitor') {
                return <ErrorBoundary><MonitorContainer sessionID={sessionID} /></ErrorBoundary>;
            }
            return <ControllerApp view={view} setView={setView} sessionID={sessionID} setSessionID={setSessionID} />;
        };

        const ControllerApp = ({ view, setView, sessionID, setSessionID }) => {
            const { useState, useEffect } = React;
            const { SetupScreen, JoinScreen, BriefingScreen, LiveSimContainer, useSimulation, ErrorBoundary, AccountButton, useAuth } = window;
            const [generatedScenario, setGeneratedScenario] = useState(null);

            // WAVE 4b / PART B: accounts are OPTIONAL and OFF THE CRITICAL PATH. useAuth() never
            // throws, never blocks and never prompts; when Firebase Authentication is not enabled
            // it simply reports available:false. The only things it gates are the Restricted
            // premade section and the Admin panel — requirement B4.
            const auth = useAuth ? useAuth() : null;

            // --- SIM ENGINE ---
            // Initializes the logic core. Pass sessionID to enable sync.
            const engine = useSimulation(generatedScenario, false, sessionID);

            // --- HANDLERS ---
            const handleGenerate = (scenario, modifiers) => {
                setGeneratedScenario(scenario);
                engine.dispatch({ type: 'LOAD_SCENARIO', payload: scenario });
                setView('briefing');
            };

            const handleStart = () => {
                engine.start();
                setView('livesim');
            };

            // ---- WAVE 4b / PART A: QUICK SIM ------------------------------------------------
            // Deliberately the SAME path as handleGenerate (same engine, same LOAD_SCENARIO, same
            // Firebase session, same monitor) with exactly two differences: the scenario is the
            // synthetic blank patient from buildQuickSimScenario(), and the briefing screen is
            // skipped because there is no brief to read. It does NOT auto-start — the facilitator
            // still presses START, so the timer/start/pause/finish controls behave as usual.
            const handleQuickSim = (opts) => {
                try {
                    const scenario = window.buildQuickSimScenario(opts || {});
                    setGeneratedScenario(scenario);
                    engine.dispatch({ type: 'LOAD_SCENARIO', payload: scenario });
                    setView('livesim');
                } catch (err) {
                    console.error('Quick Sim failed to start:', err);
                    alert('Could not start Quick Sim: ' + err.message);
                }
            };

            const handleJoin = (code) => {
                setSessionID(String(code || '').trim().toUpperCase());
                setView('monitor');
            };

            const handleResume = (saved) => {
                if (!saved || !saved.scenario) return;
                try {
                    // Snapshots only ever held {id, title} before, so rebuild the full scenario from
                    // the live definitions before anything tries to render it.
                    const scenario = window.rehydrateScenario(saved.scenario);
                    if (!scenario) return;
                    setGeneratedScenario(scenario);
                    engine.dispatch({ type: 'RESTORE_SESSION', payload: { ...saved, scenario } });
                    setView('livesim');
                } catch (e) {
                    console.error('Failed to resume session', e);
                    try { localStorage.removeItem('wmebem_sim_state'); } catch (err) {}
                    setResumeData(null);
                    alert('That saved session could not be restored and has been cleared.');
                }
            };

            // --- RECOVERY CHECK ---
            const [resumeData, setResumeData] = useState(null);
            useEffect(() => {
                // localStorage throws outright in sandboxed frames (previews, embeds), which used to
                // take the whole React tree down with a blank screen. Never let storage be fatal.
                let saved = null;
                try { saved = localStorage.getItem('wmebem_sim_state'); } catch (e) { console.warn('Session recovery unavailable (storage blocked)', e); }
                if (saved && view === 'setup') {
                    try {
                        const parsed = JSON.parse(saved);
                        if (parsed && parsed.scenario) setResumeData(parsed);
                    } catch(e) { console.warn('Discarding unreadable saved session', e); }
                }
            }, [view]);

            // --- RENDER ---
            // Controller Views (Header + Footer)
            return (
                <div className="h-full flex flex-col">
                    {/* Header */}
                    <header className="flex items-center justify-between p-3 border-b border-slate-800 bg-slate-900 flex-shrink-0">
                        <div className="flex items-center gap-3">
                            <a href="https://emevidence.org" target="_blank" rel="noopener noreferrer">
                                <img src="https://raw.githubusercontent.com/shakeymedic/wmem/main/emevidence_logo.png" alt="EM Evidence Logo" className="h-10 object-contain" />
                            </a>
                            <h1 className="text-xl font-bold text-sky-400 tracking-tight hidden md:block">EM Evidence Sim</h1>
                        </div>
                        <div className="flex items-center gap-3">
                            {view !== 'setup' && sessionID && (
                                <div className="flex flex-col items-end">
                                    <div className="text-[9px] text-slate-500 uppercase font-bold tracking-wider">Session ID</div>
                                    <div className="font-mono text-lg font-bold text-white tracking-widest leading-none select-all cursor-pointer" onClick={()=>{navigator.clipboard.writeText(sessionID); alert('Copied!');}}>{sessionID}</div>
                                </div>
                            )}
                            {/* Optional account control. Renders "Sign in" and nothing else until
                                clicked; it never interrupts, and the app is fully usable ignoring it. */}
                            {auth && AccountButton && <AccountButton auth={auth} />}
                        </div>
                    </header>

                    {/* Main Content */}
                    <main className="flex-grow overflow-hidden relative bg-slate-900">
                      <ErrorBoundary onReset={() => { try { engine.reset(); } catch (e) {} setView('setup'); }}>
                        {view === 'setup' && (
                            <SetupScreen 
                                onGenerate={handleGenerate} 
                                onQuickSim={handleQuickSim}
                                auth={auth}
                                onJoinClick={() => setView('join')} 
                                sessionID={sessionID}
                                savedState={resumeData}
                                onResume={() => handleResume(resumeData)}
                            />
                        )}
                        {view === 'join' && <JoinScreen onJoin={handleJoin} />}
                        {view === 'briefing' && (
                            <BriefingScreen 
                                scenario={generatedScenario} 
                                onStart={handleStart} 
                                onBack={() => setView('setup')} 
                            />
                        )}
                        {(view === 'livesim' || view === 'debrief') && (
                            <LiveSimContainer 
                                sim={engine} 
                                view={view} 
                                setView={setView} 
                                onRestart={() => { engine.reset(); setView('setup'); }}
                                sessionID={sessionID}
                            />
                        )}
                      </ErrorBoundary>
                    </main>

                    {/* Footer */}
                    <footer className="bg-slate-950 border-t border-slate-800 p-1 text-center text-[10px] text-slate-600 flex-shrink-0">
                        <p>&copy; {new Date().getFullYear()} <a href="https://emevidence.org" target="_blank" rel="noopener noreferrer" className="text-sky-700 hover:text-sky-500">EM Evidence</a> &nbsp;&bull;&nbsp; <a href="https://emevidence.org" target="_blank" rel="noopener noreferrer" className="hover:text-slate-400">emevidence.org</a> &nbsp;&bull;&nbsp; <a href="mailto:emevidence999@gmail.com" className="hover:text-slate-400">emevidence999@gmail.com</a></p>
                    </footer>
                </div>
            );
        };

        // --- MOUNT ---
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
