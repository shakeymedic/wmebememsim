        <div class="t1-wrap" id="device">
          <button class="fs-exit" id="btnFsExit" aria-label="Exit full screen">✕ Exit full screen</button>
          <div class="t1-scaler" id="t1scaler">

          <div class="t1 a350" id="t1">
            <div class="a-body" aria-hidden="true"></div>
            <div class="t1-lamp" id="lamp" role="img" aria-label="Alarm lamp"></div>
            <div class="t1-screenbox" id="screenbox">
              <div class="screen" id="screen">
                <div class="hdr-pat" id="hdrPat"></div>
                <button class="scr-msg" id="msgbar" data-open="alarms" data-tab="current" aria-live="polite" aria-label="Alarm messages. Touch to open the alarms"></button>
                <div class="bstat" id="bstat"></div>
                <button class="gfx" id="gfx" tabindex="-1" aria-label="Curves: airway pressure, flow and CO2">
                  <canvas id="cv1" style="top:0;height:176px"></canvas>
                  <canvas id="cv2" style="top:177px;height:176px"></canvas>
                  <canvas id="cv3" style="top:354px;height:176px"></canvas>
                </button>
                <div class="mmps" id="mmps" aria-label="Parameter fields"></div>
                <div class="smp" id="smp" aria-label="Gas measurement"></div>
                <div class="sbpage" id="sbpage" hidden></div>
                <div class="mmenu" id="mmenu" aria-label="Main menu"></div>
                <div class="tbar" id="tbar" aria-label="Therapy bar">
                  <div class="tb-mode" id="modeName"></div>
                  <div class="tb-tabs" id="tabs"></div>
                  <div class="tb-ctls" id="rcol"></div>
                  <div class="tb-fg" id="fgctl"></div>
                  <div class="tb-note" id="tbNote"></div>
                </div>
                <div class="win" id="win" hidden role="dialog" aria-modal="false" aria-label="Window"></div>
                <div class="dlg" id="dlg" hidden role="dialog" aria-label="Standby">
                  <button class="wx" id="dlgX" aria-label="Close">✕</button>
                  <h5>Standby</h5>
                  <p>Stop the therapy? Ventilation and the fresh-gas flow stop in Standby.</p>
                  <button class="wb green wide" id="dlgGo">Standby</button>
                </div>
                <div class="scr-toast" id="scrToast" hidden></div>
                <div class="scr-off" id="scrOff" hidden><span id="scrOffTxt"></span></div>
              </div>
            </div>
            <div class="t1-name">Atlan A350<small>EMEVIDENCE · ANAESTHETIC MACHINE TRAINING SIMULATOR</small></div>
            <!-- keys under the screen (the simulator's arrangement) -->
            <button class="k ap" id="kAudio" style="left:60px" aria-label="Alarm silence key, 2 minutes"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/><path d="M3 3l18 18"/></svg><span class="min">2 min</span></button>
            <span class="klbl" aria-hidden="true" style="left:64px">Alarm silence</span>
            <button class="k" id="kLight" style="left:210px" aria-label="Work light key"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9V16h7v-2.1A6 6 0 0 0 12 3z"/></svg></button>
            <span class="klbl" aria-hidden="true" style="left:199px">Work light</span>
            <button class="k pw" id="kPower" style="left:340px" aria-label="Power key: press to switch on or to go to Standby; hold in Standby to switch off"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v8"/><path d="M6.3 6.8a8 8 0 1 0 11.4 0"/></svg></button>
            <span class="klbl" aria-hidden="true" style="left:321px">On / Standby</span>
            <button class="t1-knob" id="knob" aria-label="Rotary knob. Arrow keys turn it, Enter or Space presses it to confirm"><span class="rot" id="knobRot"></span><span class="ring"></span></button>
            <span class="klbl" aria-hidden="true" style="left:930px">Rotary knob</span>
            <!-- the gas supply, the vaporiser, O2+ and the emergency O2, the APL valve, the bag and the Y-piece -->
            <div class="hw" aria-label="Machine hardware">
              <div class="hw-sup" id="supply" aria-label="Gas supply pressures"></div>
              <div class="hw-vap">
                <div class="hw-h">Vaporiser<small>Sevoflurane</small></div>
                <div class="vdial" aria-hidden="true"><span id="vapNeedle"></span></div>
                <div class="hw-row"><button class="hb" id="vapDn" aria-label="Vaporiser down">−</button><b id="vapVal" aria-live="polite">0</b><span class="hu">%</span><button class="hb" id="vapUp" aria-label="Vaporiser up">+</button></div>
              </div>
              <div class="hw-o2">
                <button class="flush" id="kFlush" aria-label="O2+ flush: hold to flush oxygen">O<sub>2</sub>+</button>
                <div class="hw-h">O2 switch</div>
                <button class="hsw" id="o2sw" aria-label="O2 switch: Aux. O2 or Add. O2"></button>
                <div class="hw-h">Flow</div>
                <div class="hw-row"><button class="hb" id="auxDn" aria-label="Emergency O2 flow down">−</button><b id="auxVal">0</b><span class="hu">L/min</span><button class="hb" id="auxUp" aria-label="Emergency O2 flow up">+</button></div>

              <div class="hw-apl">

                <div class="hw-row"><button class="hb" id="aplDn" aria-label="APL valve down (towards Spont)">−</button><b id="aplVal">30</b><button class="hb" id="aplUp" aria-label="APL valve up">+</button></div>
              </div>
              <button class="bag" id="bag" aria-label="Breathing bag: press and hold to squeeze, let go to release"><span class="bag-in" id="bagIn"></span><span class="bag-t">Bag</span></button>
              <button class="ypiece" id="ypiece" aria-label="Y-piece: seal it on the circuit plug for the tests, or connect it to the patient"></button>
            </div>
          </div>
          </div>
        </div>
